; ============================================================================
; InfinitePatch configuration
; Edit the values below, save this file, then run Install.bat again to apply.
; Close the game before running Install.bat.
; ============================================================================

[Display]
; Display mode
; 0 = Windowed, 1 = Exclusive fullscreen (vanilla), 2 = Borderless fullscreen
; Borderless removes the alt-tab lag/freeze and lets G-Sync/FreeSync work through Windows
DisplayMode = 2

; Game resolution in pixels
; 0 = Auto (native resolution of your main monitor)
ResolutionX = 0
ResolutionY = 0

; Vertical sync (the in-game "Lock Framerate" option)
; In borderless mode with VRR this caps the game at your refresh rate (480 Hz = 480 FPS) with minimal latency
; 0 = Disabled, 1 = Enabled
VSync = 1

; Framerate limit using the engine's built-in limiter
; 0 = No limit
MaxFPS = 0

; Scales the interface (HUD and menus) with resolution
; 0.0 = Vanilla (UI gets small at 1440p and 4K), 1.0 = Full scaling
UIScale = 1.0

; Widens the range of the in-game FOV slider (the game's base FOV is 70)
; Slider maximum = 70 x (1 + value / 100): 15 = vanilla (80), 50 = 105, 70 = 119
; Your FOV does not change until you move the slider in the options
FOVSliderRange = 50

[Fixes]
; Forces the game to run on your dedicated graphics card
; Fixes crashes after the intro videos and heavy lag on PCs with an integrated GPU (Ryzen 7000/9000, Intel)
; 0 = Disabled, 1 = Enabled
ForceDedicatedGPU = 1

; Enables Windows "Optimizations for windowed games" (flip model presentation) for this game
; Lower latency, VRR and instant alt-tab in borderless mode. Requires Windows 11
; 0 = Disabled, 1 = Enabled
WindowedOptimizations = 1

[General]
; Skip intro videos on game launch
; 0 = Disabled, 1 = Enabled
SkipIntro2K = 1
SkipIntroIrrational = 1
SkipIntroUnreal = 1
SkipIntroAMD = 1

[Input]
; Ignores all controllers and joysticks
; Fixes a spinning camera and Xbox button prompts caused by virtual controllers (DS4Windows, ViGEm, vJoy...)
; 0 = Disabled, 1 = Enabled
DisableControllers = 0

[Graphics]
; -1 = Keep the game's setting, 0 = Off, 1 = On

; Lens flares and lens dirt
LensFlares = -1

; Depth of field
DepthOfField = -1

; Motion blur
MotionBlur = -1

; Higher resolution light shafts (Light Shafts must be enabled in-game)
HighQualityLightShafts = -1

; Shadow map resolution, beyond the game's Ultra setting (2048)
; 0 = Keep the game's setting, 4096 = Sharper shadows, 8192 = Even sharper (heavy)
ShadowResolution = 0

